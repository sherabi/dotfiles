# Reload tmux config with C-s r

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# True color settings
# default-terminal must be a tmux-aware terminfo entry (not the outer $TERM)
# so that programs inside tmux (e.g. Neovim) see a supported $TERM value.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# Let Neovim's 'autoread' notice focus changes (e.g. switching tmux panes).
set -g focus-events on

set -g default-shell /opt/homebrew/bin/bash
set -g base-index 1
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path} '
# set-option -g automatic-rename-format '#{b:pane_current_path} #{pane_current_command}'
set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},bash},#{b:pane_current_path},#{b:pane_current_path} #{pane_current_command}}'
set-window-option -g window-status-current-style fg=red
set-option -g set-titles on
# For Pi
set -g extended-keys on
set -g extended-keys-format csi-u
# set-option -g status-position top

# Reset bind key
unbind-key C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Simple resize: prefix + Shift + arrow keys
bind -r S-Left resize-pane -L 3
bind -r S-Down resize-pane -D 3
bind -r S-Up resize-pane -U 3
bind -r S-Right resize-pane -R 3

# Vim split awareness for pane switching
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# Arrow keys with vim-tmux-navigator awareness (requires prefix)
bind-key Left  if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key Down  if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key Up    if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key Right if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

set -g history-limit 10000

unbind | # unbind default vertical split key
bind-key v split-window -h
bind-key h split-window -v

# Shift arrow to switch windows
bind -n C-S-Left  previous-window
bind -n C-S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# THEME
set -g status-bg colour235
set -g status-fg colour33
set -g status-interval 1
set -g status-left-length 30
set -g status-right-length 250
set -g status-left '#[fg=red](#S #I:#P) #[fg=colour166]#(whoami) ' #Session Window:Pane numbers
set -g status-right '#[fg=yellow]#{pane_current_path} #[fg=green]%a %h %d %Y %I:%M %p'

# pane border
set-option -g pane-border-style fg=colour240 #base01
set-option -g pane-active-border-style fg=colour33 #blue

# visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on

# Mouse
set -g mouse on

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
